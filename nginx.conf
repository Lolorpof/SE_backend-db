# Main events block - Controls how Nginx handles connections
events {
    # Maximum number of simultaneous connections that can be opened by a worker process
    worker_connections 1024;
}

# Main HTTP block - Contains all HTTP-related directives
http {
    # Include MIME types definitions
    include       /etc/nginx/mime.types;
    # Set default MIME type if not detected
    default_type  application/octet-stream;

    # Timeout configurations for long-running operations
    # Time to establish a connection with the proxied server
    proxy_connect_timeout 300;
    # Time to send a request to the proxied server
    proxy_send_timeout 300;
    # Time to read a response from the proxied server
    proxy_read_timeout 300;
    # Time for sending response to client
    send_timeout 300;

    # Upstream retry and error handling configuration
    # Define conditions when a request should be passed to the next server
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    # Maximum number of retry attempts
    proxy_next_upstream_tries 3;
    # Total timeout for all retry attempts
    proxy_next_upstream_timeout 10s;

    # Upstream server definitions - Define backend service locations
    # Backend API service
    upstream backend {
        # Format: server hostname:port [parameters]
        # max_fails: number of failed attempts before marking server as unavailable
        # fail_timeout: time server is marked unavailable
        server t10-backend:6977 max_fails=3 fail_timeout=30s;
    }

    # MinIO object storage API
    upstream minio_api {
        server t10-minio:9000 max_fails=3 fail_timeout=30s;
    }

    # MinIO web console interface
    upstream minio_console {
        server t10-minio:9090 max_fails=3 fail_timeout=30s;
    }

    # pgAdmin database management interface
    upstream pgadmin {
        server t10-pgadmin:80 max_fails=3 fail_timeout=30s;
    }

    # Custom log format for detailed request tracking
    # $remote_addr: Client IP
    # $remote_user: Client username for authentication
    # $time_local: Local time of request
    # $request: Full HTTP request line
    # $status: Response status code
    # rt: Request time
    # uct: Upstream connect time
    # uht: Time to receive upstream headers
    # urt: Time to receive upstream response
    log_format custom_log '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    
    # Define log file locations and levels
    access_log /var/log/nginx/access.log custom_log;
    error_log /var/log/nginx/error.log warn;

    # Server block - Defines a virtual server configuration
    server {
        # Listen on port 80 (HTTP)
        listen 80;
        # Server name (domain or IP)
        server_name localhost;
        # Maximum allowed size of client request body
        client_max_body_size 100M;
        # Allow special characters in headers
        ignore_invalid_headers off;

        # Health check endpoint for monitoring
        location /health {
            access_log off;  # Don't log health checks
            return 200 "healthy\n";
        }

        # Root location - Handles requests to /
        location / {
            # Forward requests to backend service
            proxy_pass http://backend;
            # Standard proxy headers for request forwarding
            proxy_set_header Host $host;  # Original host header
            proxy_set_header X-Real-IP $remote_addr;  # Client's real IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Proxy chain
            proxy_set_header X-Forwarded-Proto $scheme;  # Original protocol (http/https)
            
            # Error handling configuration
            proxy_intercept_errors on;  # Allow Nginx to intercept upstream errors
            error_page 502 503 504 /50x.html;  # Redirect error responses
        }

        # Backend API specific routes
        location /api/ {
            proxy_pass http://backend;
            # Same proxy headers as root location
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }

        # MinIO API routes
        location /minio/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Expose-Headers' '*' always;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            chunked_transfer_encoding off;
            proxy_buffering off;

            proxy_pass http://minio_api/;
        }

        # MinIO Console web interface
        location /minio-console/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Expose-Headers' '*' always;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            chunked_transfer_encoding off;
            proxy_buffering off;

            proxy_pass http://minio_console/;
        }

        # MinIO Console API routes
        location /api/v1/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Expose-Headers' '*' always;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            chunked_transfer_encoding off;
            proxy_buffering off;

            proxy_pass http://minio_console/api/v1/;
        }

        # MinIO Console static assets
        location ~ ^/(images/|styles/|.*\.(js|css|svg|png|json))$ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;

            # Disable buffering for static assets
            proxy_buffering off;
            proxy_request_buffering off;

            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            proxy_pass http://minio_console/$request_uri;
            
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }

        # pgAdmin web interface
        location /pgadmin/ {
            proxy_pass http://pgadmin/;  # Note the trailing slash
            # Special header for pgAdmin sub-path deployment
            proxy_set_header X-Script-Name /pgadmin;
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Scheme $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_intercept_errors on;
            error_page 502 503 504 /50x.html;
        }

        # Error page configuration
        location = /50x.html {
            root /usr/share/nginx/html;  # Serve from default Nginx html directory
            internal;  # Only accessible through internal redirects
        }

        # Favicon handling
        location = /favicon.ico {
            access_log off;  # Don't log favicon requests
            log_not_found off;  # Don't log missing favicon
            return 204;  # Return "No Content" status
        }
    }
}