# Main events block - Controls how Nginx handles connections
events {
    # Maximum number of simultaneous connections that can be opened by a worker process
    worker_connections 1024;
}

# Main HTTP block - Contains all HTTP-related directives
http {
    # Include MIME types definitions
    include       /etc/nginx/mime.types;
    # Set default MIME type if not detected
    default_type  application/octet-stream;

    # Common CORS headers - Moved to http context
    map $request_method $cors_method {
        OPTIONS 'GET, POST, PUT, DELETE, OPTIONS';
        default $request_method;
    }

    # Timeout configurations for long-running operations
    # Time to establish a connection with the proxied server
    proxy_connect_timeout 300;
    # Time to send a request to the proxied server
    proxy_send_timeout 300;
    # Time to read a response from the proxied server
    proxy_read_timeout 300;
    # Time for sending response to client
    send_timeout 300;

    # Upstream retry and error handling configuration
    # Define conditions when a request should be passed to the next server
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    # Maximum number of retry attempts
    proxy_next_upstream_tries 3;
    # Total timeout for all retry attempts
    proxy_next_upstream_timeout 10s;

    # Upstream server definitions - Define backend service locations
    # Backend API service
    upstream backend {
        server t10-backend:6977;  # Your backend service
    }

    # MinIO object storage API
    upstream minio_api {
        server t10-minio:9000;
    }

    # pgAdmin database management interface
    upstream pgadmin {
        
        server t10-pgadmin:80;
    }

    # Custom log format for detailed request tracking
    # $remote_addr: Client IP
    # $remote_user: Client username for authentication
    # $time_local: Local time of request
    # $request: Full HTTP request line
    # $status: Response status code
    # rt: Request time
    # uct: Upstream connect time
    # uht: Time to receive upstream headers
    # urt: Time to receive upstream response
    log_format custom_log '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    
    # Define log file locations and levels
    access_log /var/log/nginx/access.log custom_log;
    error_log /var/log/nginx/error.log warn;

    # Server block - Defines a virtual server configuration
    server {
        # Listen on port 80 (HTTP)
        listen 80;
        # Listen on port 1982 for existing MinIO service code compatibility
        listen 1982;
        # Server name (domain or IP)
        server_name localhost;
        # Maximum allowed size of client request body
        client_max_body_size 0;
        # Allow special characters in headers
        ignore_invalid_headers off;
        # Disable buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # Root directory for frontend static files
        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint for monitoring
        location /health {
            access_log off;  # Don't log health checks
            return 200 "healthy\n";
        }
        # MinIO API endpoints
        location ~ ^/(minio|register|profile)/ {
            proxy_pass http://minio_api;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            proxy_http_version 1.1;
            chunked_transfer_encoding off;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
            send_timeout 300;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' $cors_method always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $http_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' $cors_method always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range' always;
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }
        }

        # Backend API endpoints
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $http_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
                add_header 'Access-Control-Max-Age' 1728000;
                return 204;
            }
        }

        # Frontend static files
        location / {
            try_files $uri $uri/ /index.html;
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # pgAdmin web interface
        location /pgadmin/ {
            proxy_pass http://pgadmin/;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Error page configuration
        location = /50x.html {
            root /usr/share/nginx/html;  # Serve from default Nginx html directory
            internal;  # Only accessible through internal redirects
        }

        # Favicon handling
        location = /favicon.ico {
            access_log off;  # Don't log favicon requests
            log_not_found off;  # Don't log missing favicon
            return 204;  # Return "No Content" status
        }
    }
}