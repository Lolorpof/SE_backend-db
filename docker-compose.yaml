name: t10_skillbridge
services:
  database:
    image: postgres:17.2-alpine
    container_name: t10-database
    environment:
      - POSTGRES_USER=${POSTGRES_SUPERUSER}
      - POSTGRES_PASSWORD=${POSTGRES_SUPERPASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    # ports:
    #   - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - t10-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: t10-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    # ports:
    #   - "5050:80"
    depends_on:
      - database
    networks:
      - t10-network
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio
    container_name: t10-minio
    ports:
      - ${MINIO_API_PORT}:9000
      - ${MINIO_WEBUI_PORT}:9090
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      - database
    command: server /data --console-address ":9090"
    volumes:
      - minio_data:/data
      - ./scripts/minio-init.sh:/usr/bin/minio-init.sh
    networks:
      - t10-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...' &&
      chmod +x /usr/bin/minio-init.sh &&
      /usr/bin/minio-init.sh &
      /usr/bin/docker-entrypoint.sh server /data --console-address ':9090'
      "
  nginx:
    image: nginx:latest
    container_name: t10-nginx
    ports:
      - "80:80"
      - "1982:1982"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      database:
        condition: service_healthy
      pgadmin:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - t10-network
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${PORT-6977}
    container_name: t10-backend
    ports:
      - ${PORT-6977}:${PORT-6977}  # Temporarily enabled for development
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env
    volumes:
      - init_flags:/usr/src/app/backend/.init
    networks:
      - t10-network

networks:
  t10-network:
volumes:
  database_data:
  minio_data:
  init_flags:
  nginx_cache:
